name: Launch health

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify hosted API health contract
        run: |
          response=$(curl --fail --silent --show-error --max-time 15 https://upgrade-impact-beta-api.rumman-formaai.workers.dev/healthz)
          jq -e '.status == "ok" and .apiVersion == 1 and .retention == "request-content-memory-only"' <<<"$response"
      - name: Verify Marketplace listing and current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/mohdrumman1/upgrade-impact/releases/latest --jq .tag_name)
          test "$latest" = "v1-beta.4"
          marketplace=$(curl --fail --silent --show-error --max-time 15 https://github.com/marketplace/actions/upgradeimpact)
          grep -q 'UpgradeImpact' <<<"$marketplace"
          grep -q "$latest" <<<"$marketplace"
